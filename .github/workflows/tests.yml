name: tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # One KLayout for the whole ecosystem. The source of truth is
  # `ARG KLAYOUT_PIP` in the adk-tools Dockerfile, which is also the version
  # Chiplet Studio's in-tree extern/klayout is pinned at. Testing a deck
  # against a different KLayout than the one the image ships proves the deck
  # works somewhere other than where it runs.
  KLAYOUT_VERSION: "0.30.5"
  # Pinned by content, not just by name, so a .deb that changes under a stable
  # URL cannot silently change what these decks were checked against.
  KLAYOUT_DEB_SHA256: "9f88fe45d1992fc9bd0ce986bbbe150ad198c6a59a86fc13343db822a5790e49"

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # No requirements file in this repo: key the pip cache on the
          # dependency list below (this file).
          cache-dependency-path: .github/workflows/tests.yml

      - name: Install Python dependencies
        # pyyaml: the vendored chiplet_format_io reader used by the
        # chiplet2dbx exporter parses .chiplet (YAML) with it.
        run: pip install pytest "klayout==${KLAYOUT_VERSION}" jinja2 jsonschema pyyaml

      - name: Install KLayout CLI
        # The DRC-deck tests shell out to `klayout -b`; the pip `klayout` wheel
        # ships only the Python module, so without the CLI those 18 tests skip
        # and the deck semantics go unchecked here. Install the CLI so they run.
        # The adk-tools umbrella image is the authoritative deck gate; this is
        # defense in depth, so a download failure warns rather than failing the
        # job. klayout.org does keep older builds (0.30.5, 0.30.9 and 0.30.10
        # were all reachable when this was last checked), so a 404 here means
        # something changed at the source, not that the pin aged out.
        #
        # A download that succeeds is held to the pin: wrong checksum or wrong
        # reported version fails the job. Those are not availability problems,
        # they mean the decks would be checked against something other than
        # what the image ships, which is the exact skew this env block exists
        # to prevent.
        run: |
          set -x
          KLAYOUT_DEB="klayout_${KLAYOUT_VERSION}-1_amd64.deb"
          if curl -fsSLO "https://www.klayout.org/downloads/Ubuntu-24/${KLAYOUT_DEB}"; then
            echo "${KLAYOUT_DEB_SHA256}  ${KLAYOUT_DEB}" | sha256sum -c -
            sudo apt-get update
            sudo apt-get install -y "./${KLAYOUT_DEB}"
            klayout -b -v
            klayout -b -v 2>&1 | grep -qF "${KLAYOUT_VERSION}"
          else
            echo "::warning::Could not download ${KLAYOUT_DEB}; the DRC-deck tests will skip. Check https://www.klayout.org/downloads/Ubuntu-24/ and the KLAYOUT_VERSION env above."
          fi

      - name: Run tests
        run: pytest tests -q

  # The one required status check. A single collector context per repository
  # means a ruleset names `ci-gate` everywhere and never has to be edited when
  # the job list inside a workflow changes.
  ci-gate:
    needs: [tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gating job to have succeeded
        # `needs` alone does not gate: with `if: always()` this job runs even
        # when a dependency failed, so the result has to be compared
        # explicitly. Without the comparison the gate reports green after its
        # dependencies went red.
        run: |
          echo "tests: ${{ needs.tests.result }}"
          test "${{ needs.tests.result }}" = "success"
